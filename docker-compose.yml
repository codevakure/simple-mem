version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: simplemem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-simplemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplemem_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-simplemem_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-simplemem} -d ${POSTGRES_DB:-simplemem_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simplemem-network

  simplemem-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simplemem-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: /app/logs/simplemem.log
      LOG_COLORS: "true"
      ENDPOINT: ${ENDPOINT:-bedrock}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      BEDROCK_LLM_MODEL: ${BEDROCK_LLM_MODEL:-amazon.nova-micro-v1:0}
      BEDROCK_EMBEDDING_MODEL: ${BEDROCK_EMBEDDING_MODEL:-amazon.titan-embed-text-v2:0}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-simplemem}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-simplemem_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-simplemem_db}
      DATABASE_URL: postgresql://${POSTGRES_USER:-simplemem}:${POSTGRES_PASSWORD:-simplemem_dev_password}@postgres:5432/${POSTGRES_DB:-simplemem_db}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-5}
      WINDOW_SIZE: ${WINDOW_SIZE:-8}
      UVICORN_HOST: 0.0.0.0
      UVICORN_PORT: 8001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - simplemem-network

volumes:
  postgres_data:
    driver: local

networks:
  simplemem-network:
    name: simplemem-network
    driver: bridge

# ============================================================================
# Connection Settings:
# ============================================================================
# SimpleMem API: http://localhost:8001
# PostgreSQL (pgAdmin): localhost:5433
# Database: simplemem_db
# Username: simplemem
# Password: simplemem_dev_password
# ============================================================================
